<style>
:root{--or:#F9A11B;--onor:#222;--am:#F5A623;--rd:#EE3F24;--ink:#222;--mut:#777;--bg:#f4f1ec;--card:#fff;--ln:#e4dfd6;--ok:#2e8b57}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;padding-bottom:84px}
h1,h2,h3{margin:0}
#hd{background:var(--or);color:var(--onor);padding:10px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
#hd .t{flex:1;min-width:0}
#hd .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hd .t small{font-size:12px;opacity:.85}
#hd select{max-width:38vw}
#hd button.bell{background:transparent;border:0;font-size:24px;padding:2px 6px;position:relative;color:inherit}
#hd button.bell .nb{position:absolute;top:-2px;right:-2px;margin:0}
#main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:8px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:60px;resize:vertical}
input:disabled{background:#eee}
button{border:1px solid var(--ln);background:#fff;border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--ink)}
button.pri{background:var(--or);border-color:var(--or);color:var(--onor);font-weight:700}
button.dng{color:var(--rd);border-color:var(--rd)}
button.good{background:#eaf6ee;border-color:var(--ok);color:#1e7a46;font-weight:700}
button.sm{padding:6px 10px;font-size:13px}
button.big{width:100%;padding:14px;font-size:16px;margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px}
.seg button{flex:1}
.seg button.on{background:var(--or);border-color:var(--or);color:var(--onor);font-weight:700}
.grp{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--mut);margin:12px 0 4px;letter-spacing:.04em}
.it{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--ln);border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fff;width:100%;text-align:left}
.it .bx,.tk .bx{width:24px;height:24px;border:2px solid #bbb;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
.it.on{background:#eaf6ee;border-color:var(--ok)}
.it.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:#fdf0d8;border:1px solid var(--or);border-radius:16px;padding:4px 6px 4px 10px;font-size:14px;display:flex;align-items:center;gap:6px}
.chip button{border:0;background:transparent;padding:0 4px;font-size:16px;color:var(--rd)}
.mut{color:var(--mut);font-size:13px}
.ok{color:var(--ok);font-weight:700}
.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.li:last-child{border-bottom:0}
.li .n{flex:1;min-width:0;word-break:break-word}
.badge{font-size:11px;background:#eee;border-radius:10px;padding:2px 8px;color:#555;white-space:nowrap}
.badge.am{background:#fff0cf;color:#8a5200}.badge.rd{background:#fde8e4;color:#c4291a}.badge.gr{background:#e3f4e9;color:#1e7a46}.badge.bl{background:#e6eefb;color:#1f4f9a}
#nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
#nav button{flex:1;border:0;border-radius:0;background:#fff;padding:10px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button span{font-size:20px}
#nav button.on{color:var(--rd);font-weight:700;border-top:3px solid var(--rd);padding-top:7px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:40;max-width:90vw;display:none;font-size:14px;text-align:center}
#toast.err{background:var(--rd)}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:50;display:none;align-items:center;justify-content:center;font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;display:none;align-items:flex-end;justify-content:center}
#modal .mb{background:#fff;width:100%;max-width:720px;border-radius:16px 16px 0 0;padding:14px;max-height:92vh;display:flex;flex-direction:column}
#modal .mb .scr{overflow:auto;flex:1;margin:8px 0}
#modal .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pkit{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin-bottom:5px}
#login{max-width:380px;margin:12vh auto 0;padding:0 16px}
#login .card{padding:20px}
#login h1{text-align:center;margin-bottom:4px}
.hide{display:none}
.pkg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.tile{border:1px solid var(--ln);border-radius:8px;padding:8px 6px;font-size:13px;text-align:center;min-height:46px;display:flex;align-items:center;justify-content:center;background:#fff;line-height:1.15;word-break:break-word}
.tile.on{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
.dest{flex-direction:column;gap:2px;min-height:62px}
.dest small{font-size:11px;font-weight:400;opacity:.85}
.eqg{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.eq{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--ln);border-radius:12px;padding:10px;background:#fff}
.eq .ic{font-size:26px;line-height:1}
.eq .tx{flex:1;min-width:0}
.eq b{display:block;font-size:14px;line-height:1.2;margin-bottom:2px}
.eq .sd{display:block;font-size:12px;color:#555;line-height:1.3}
.eq.bad{background:#fde8e4;border-color:var(--rd)}.eq.bad .sd:first-of-type{color:var(--rd);font-weight:700}
.eq.warn{background:#fff4dc;border-color:var(--am)}.eq.warn .sd:first-of-type{color:#9a5b00;font-weight:700}
.eq.ok{background:#eef8f1;border-color:#bfe3cb}.eq.ok .sd:first-of-type{color:var(--ok);font-weight:700}
.eq.dan{animation:pulse 1.6s infinite}
.bar{display:block;height:7px;background:rgba(0,0,0,.1);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.bad .bar i{background:var(--rd)}.warn .bar i{background:var(--am)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(238,63,36,.45)}70%{box-shadow:0 0 0 9px rgba(238,63,36,0)}100%{box-shadow:0 0 0 0 rgba(238,63,36,0)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.kp{border-radius:10px;padding:8px 2px;text-align:center;font-size:11px;font-weight:700}
.kp b{display:block;font-size:26px;line-height:1.1}
.kp.bad{background:#fde8e4;color:var(--rd)}.kp.warn{background:#fff4dc;color:#9a5b00}.kp.ok{background:#eef8f1;color:var(--ok)}.kp.gray{background:#eee;color:#555}
.ab{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border-radius:12px;padding:12px;margin-bottom:12px;border:2px solid;font-size:14px;line-height:1.35}
.ab .ai{font-size:30px;line-height:1}
.ab.bad{background:#fde8e4;border-color:var(--rd);animation:pulse 1.8s infinite}
.ab.warn{background:#fff4dc;border-color:var(--am)}
.ab.good{background:#eef8f1;border-color:#bfe3cb}
.ab.info{background:#eef3fb;border-color:#b9cdea}
.pbar{height:10px;border-radius:5px;background:#e8e4dc;overflow:hidden;margin:2px 0 6px}
.pbar i{display:block;height:100%;border-radius:5px;background:var(--rd)}
.pbar.mid i{background:var(--am)}.pbar.full i{background:var(--ok)}
.logo{width:42px;height:42px;border-radius:10px;object-fit:contain;background:#fff;flex:none;padding:2px}
.logo.ini{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#222}
.logo.big{width:72px;height:72px}
.lgs{display:flex;gap:16px;justify-content:center;align-items:center;margin-bottom:12px}
.lgs img{height:64px;max-width:44%;object-fit:contain}
.pend{border-left:6px solid var(--am)}
.nb{background:var(--rd);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;margin-left:2px}
.gh{display:flex;align-items:center;gap:8px;margin:14px 0 2px;padding-bottom:4px;border-bottom:2px solid var(--or)}
.gh b{flex:1}
.alert{background:#fdeeea;border:1px solid var(--rd);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:14px}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
/* tareas */
.tk{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--ln);border-radius:10px;padding:8px;margin-bottom:6px;background:#fff}
.tk.on{background:#eaf6ee;border-color:var(--ok)}
.tk.late{background:#fff4dc;border-color:var(--am)}
.tk.rej{background:#fde8e4;border-color:var(--rd)}
.tk .tt{flex:1;min-width:0;line-height:1.3}
.tk .tt b{display:block;font-weight:600}
.tk .ac{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:112px}
.tk .bxb{padding:0;border:0;background:transparent;flex:none}
.tk.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.tk.late .bx{background:var(--am);border-color:var(--am);color:#fff}
.tk.rej .bx{border-color:var(--rd);color:var(--rd)}
.tk .bx.lim{border:0;font-size:20px;width:24px}
.pill{display:inline-block;border-radius:12px;padding:2px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.pill.g{background:#e3f4e9;color:#1e7a46}.pill.a{background:#fff0cf;color:#8a5200}.pill.r{background:#fde8e4;color:#c4291a}.pill.n{background:#eee;color:#666}
.bign{font-size:44px;font-weight:800;line-height:1}
.bign.g{color:#1e7a46}.bign.a{color:#b86e00}.bign.r{color:#c4291a}.bign.n{color:#999}
.rk{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;border-radius:0;text-align:left}
.rk .pos{width:30px;text-align:center;font-weight:700}
.rk .n{flex:1;min-width:0}
.spark{display:flex;align-items:flex-end;gap:1px;height:22px;width:70px}
.spark i{display:block;flex:1;border-radius:1px;min-height:2px}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:9px;fill:#666}
.menu{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin-bottom:8px;border-radius:12px}
.menu span.i{font-size:26px}
.menu b{display:block}
.sel{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.sel .nm{flex:1;min-width:0;font-size:14px;line-height:1.2}
.sel input[type=number]{width:78px}
.sel .un{width:92px}
.pedt{width:100%;min-height:210px;font-size:14px;line-height:1.35}
.stk{position:sticky;top:0;background:#fff;z-index:1}
.stp{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln);font-size:14px}
.stp .s{width:24px;text-align:center}
.stp .n{flex:1}
</style>

var COL = { g: '#2e8b57', a: '#F5A623', r: '#EE3F24', n: '#ddd' };
function pc(p) { return p == null ? 'n' : (p >= 90 ? 'g' : (p >= 70 ? 'a' : 'r')); }
function pill(p) { return '<span class="pill ' + pc(p) + '">' + (p == null ? 'sin datos' : p + '%') + '</span>'; }
function palabra(p) { return p == null ? 'Sin datos todavía' : (p >= 90 ? 'Excelente' : (p >= 80 ? 'Bien' : (p >= 70 ? 'Regular' : 'Requiere atención'))); }
function chart(serie) {
  var n = serie.length, w = 320, h = 118, pl = 24, pb = 16, bw = (w - pl) / n, g = '', top = 6, ph = h - pb - top;
  [100, 70].forEach(function (v) { var y = top + ph * (1 - v / 100); g += '<line x1="' + pl + '" x2="' + w + '" y1="' + y + '" y2="' + y + '" stroke="#e4dfd6" stroke-dasharray="3 3"/><text x="2" y="' + (y + 3) + '">' + v + '</text>'; });
  serie.forEach(function (s, i) {
    var x = pl + i * bw + bw * 0.14, bwid = bw * 0.72;
    if (s.p == null) g += '<rect x="' + x + '" y="' + (top + ph - 2) + '" width="' + bwid + '" height="2" fill="#ddd"/>';
    else { var bh = Math.max(2, ph * s.p / 100); g += '<rect x="' + x + '" y="' + (top + ph - bh) + '" width="' + bwid + '" height="' + bh + '" rx="2" fill="' + COL[pc(s.p)] + '"><title>' + fmtF(s.f) + ': ' + s.p + '%</title></rect>' + (n <= 8 ? '<text x="' + (x + bwid / 2) + '" y="' + (top + ph - bh - 2) + '" text-anchor="middle">' + s.p + '</text>' : ''); }
    if (n <= 8 || i % 5 === 0 || i === n - 1) g += '<text x="' + (x + bwid / 2) + '" y="' + (h - 4) + '" text-anchor="middle">' + (+s.f.slice(8)) + '</text>';
  });
  return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Gráfica de cumplimiento por día">' + g + '</svg>';
}
function spark(serie) { return '<span class="spark">' + serie.map(function (s) { return '<i style="height:' + (s.p == null ? 2 : Math.max(3, Math.round(s.p * 0.22))) + 'px;background:' + COL[pc(s.p)] + '"></i>'; }).join('') + '</span>'; }
async function loadRes(soft) {

  if (soft && had && S.res.t && Date.now() - S.res.t < 30000) return;     // cambio de ventana con datos recientes: se muestran tal cual

  if (S.tab === 'res') render();
}

function logoFromFile(file) {
  return new Promise(function (ok, bad) {
    var fr = new FileReader();
    fr.onerror = function () { bad(new Error('No se pudo leer la imagen')); };
    fr.onload = function () {
      var im = new Image();
      im.onerror = function () { bad(new Error('Imagen no válida')); };
      im.onload = function () {
        var sizes = [192, 144, 112, 80];
        for (var i = 0; i < sizes.length; i++) {
          var sc = Math.min(1, sizes[i] / Math.max(im.width, im.height)), c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(im.width * sc)); c.height = Math.max(1, Math.round(im.height * sc));
          var x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height);
          var u = c.toDataURL('image/png');
          if (u.length > 45000) { x.globalCompositeOperation = 'destination-over'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); u = c.toDataURL('image/jpeg', 0.82); }
          if (u.length <= 45000) { ok(u); return; }
        }
        bad(new Error('La imagen es muy compleja; usa un logo más simple'));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    else f += '<input id="' + id + '" value="' + esc(v) + '">';
  });
  if (t === 'proveedores') {
    f += '<p class="mut">Horario: la hora límite para pedir es el cierre menos el margen (15 min si lo dejas vacío). Con eso la app avisa “el proveedor está por cerrar” y calcula para qué día llega el pedido. Sin horario, no se restringe nada.</p>';
    if (S.user.rol === 'admin' && S.sucs.length > 1) f += '<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px;margin-top:8px"><input type="checkbox" id="f_ambas" style="width:auto"' + ((idx == null || it.Otra === 'SI') ? ' checked' : '') + '> Usar / aplicar también en ' + esc(otraSuc()) + '</label>';
  }
  if (t === 'equipos') f += '<p class="mut">Para programar: elige Fijo o Rotar, el turno y el día de inicio. Ej. “cada 12 días, Matutino, inicia el 12/oct”.</p>';
  openModal('<div class="mb"><h3>' + (idx == null ? 'Agregar' : 'Editar') + ' · ' + CATS[t].t + '</h3><div class="scr">' + f + '</div><div class="btns"><button data-act="mCancel">Cancelar</button><button class="pri" data-act="mOk">Guardar</button></div></div>');
  MOK = async function () {
    var o = {};
    c.campos.forEach(function (k) { o[k] = $('#f_' + k).value; });
    var amb = !!($('#f_ambas') && $('#f_ambas').checked);
    try {
      if (idx == null) { o.tipo = t; o.ambas = amb; await run(call('catAdd', o)); }
      else await run(call('catEdit', { tipo: t, vals: it, nuevo: o, ambas: amb }));
      closeModal(); toast('Guardado ✔'); await refresh();
    } catch (e) {}
  };
}
function renDlg(t, g) {
  var c = CATS[t];
  openModal('<div class="mb"><h3>Renombrar ' + esc(LBL[c.grp].toLowerCase()) + '</h3><p class="mut">Cambia el nombre en todos los elementos de “' + esc(g || '(sin nombre)') + '”.</p><input id="f_ren" value="' + esc(g) + '"><div class="btns" style="margin-top:12px"><button data-act="mCancel">Cancelar</button><button class="pri" data-act="mOk">Guardar</button></div></div>');
  MOK = async function () {
    try { await run(call('catRen', { tipo: t, de: g, a: $('#f_ren').value })); closeModal(); toast('Renombrado ✔'); await refresh(); } catch (e) {}
  };
}
/* ================= eventos ================= */
document.addEventListener('click', async function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var a = el.dataset.act, d = el.dataset;
  switch (a) {
    case 'login': doLogin(); break;
    case 'logout': logout(); break;
    case 'tab': tab(d.v); break;
    case 'sub': S.sub = d.v; if (d.v === 'plan' || d.v === 'lista') { S.plan.data = null; if (d.v === 'lista') S.plan.fecha = S.hoy; } render(); masLoad(); window.scrollTo(0, 0); break;
    case 'seg':
      setPath(d.k, d.v);
      if (d.k === 'tar.turno') loadTar(); else if (d.k === 'cie.turno') loadCie(); else render();
      break;
    case 'avi': openAvi(); break;
    case 'aviGo': var av = S.avi[+d.i]; closeModal(); if (av) { if (av.tab === 'mas') tab('mas', 'ent'); else tab(av.tab); } break;
    case 'aviOk': aviLeido([S.avi[+d.i].k]); closeModal(); break;
    case 'aviAll': aviLeido(S.avi.filter(function (x) { return !x.fija; }).map(function (x) { return x.k; })); closeModal(); break;
    case 'tarTog': tarTog(+d.i); break;
    case 'tarVal': tarVal([claveDe(S.tar.data.items[+d.i])], d.v); break;
    case 'tarRech': rechDlg(+d.i); break;
    case 'tarAsig': asigDlg(+d.i); break;
    case 'pendHecho': pendHecho(d.id); break;
    case 'pendAsig': pendDlg(d.id); break;
    case 'pasarLista': S.plan.fecha = S.hoy; S.plan.data = null; tab('mas', 'lista'); break;
    case 'listaOk': planSet({ tipo: 'LISTA', turno: S.plan.data.limit, on: true }, 'Lista confirmada ✔'); break;
    case 'listaSkip': S.lista.req = false; S.flSkip.lista = 1; render(); if (!gatePaso()) loadTar(); break;
    case 'flPendAsig': flPendDlg(d.id); break;
    case 'flPendHecho': flPendHecho(d.id); break;
    case 'flSemAsig': flSemDlg(d.e, 'asig'); break;
    case 'flSemAdel': flSemDlg(d.e, 'adel'); break;
    case 'flOk': flOk(d.p); break;
    case 'flSkip': flSkip(d.p); break;
    case 'tarAprobarTodo':
      tarVal(tarItems().filter(function (x) { return x.it.pv && !x.it.val; }).map(function (x) { return claveDe(x.it); }), 'Aprobada'); break;
    case 'goCierre': S.cie.turno = S.tar.data.turno; S.cie.area = d.a; S.cie.data = null; tab('mas', 'cierre'); break;
    case 'cieVolver': S.tar.turno = S.cie.turno; S.tar.fecha = S.hoy; S.tar.vista = S.cie.area === S.user.area ? 'area' : 'todas'; tab('tar'); break;
    case 'cieCerrar': cierreDlg(+d.p); break;
    case 'planDesc': planSet({ tipo: 'DESCANSO', usuario: d.n, on: d.on === '1' }, d.on === '1' ? 'Marcado: descansa / falta' : 'Vuelve a su turno'); break;
    case 'planMov': movDlg(d.n); break;
    case 'movQuitar': closeModal(); planSet({ tipo: 'MOVER', usuario: d.n, turno: '', area: '' }, 'Movimiento quitado'); break;
    case 'planCerr': planSet({ tipo: 'CERRADO', turno: d.t, on: d.on === '1' }, d.on === '1' ? 'Turno marcado sin operación' : 'Turno vuelve a operar'); break;
    case 'entSave': saveEnt(); break;
    case 'togCerrar': var k = S.ent.cerrar.indexOf(d.id); if (k >= 0) S.ent.cerrar.splice(k, 1); else S.ent.cerrar.push(d.id); render(); break;
    case 'rmNew': S.ent.nuevos.splice(+d.i, 1); render(); break;
    case 'pick': openPicker(d.t); break;
    case 'pkItem': pkToggle(d.n); break;
    case 'pkOther':
      var v = $('#pko').value.trim();
      if (v) { if (!pkHas(PK.t, v)) S.ent.nuevos.push({ tipo: PK.t, desc: v.slice(0, 200) }); $('#pko').value = ''; $('#pkl').innerHTML = pkList(); }
      break;
    case 'pkDone': closeModal(); render(); break;
    case 'pedNew': await pedFresco(); openPed(d.d); break;
    case 'ppItem':
      if (PP.sel[d.n]) delete PP.sel[d.n]; else PP.sel[d.n] = { cant: Number(d.c) > 0 ? Number(d.c) : 1, u: d.u || 'pza' };
      ppRefresh(); break;
    case 'ppQuitar': delete PP.sel[Object.keys(PP.sel)[+d.i]]; ppRefresh(); break;
    case 'ppOtro':
      var ov = $('#ppo').value.trim();
      if (ov) { if (!PP.sel[ov]) PP.sel[ov] = { cant: 1, u: 'pza' }; $('#ppo').value = ''; ppRefresh(); }
      break;
    case 'ppGuardar': ppGuardar(); break;
    case 'ppModo': if (d.m === 'AGREGAR') ppDupDlg(); else ppEnviar('NUEVO'); break;
    case 'ppVolver': ppVolver(); break;
    case 'pedEdit': pedEditDlg(d.id); break;
    case 'pedAnadir': { await pedFresco(); var pa = pedById(d.id); if (!pa || pa.estado !== 'En preparación') { toast('Ese pedido ya se envió o se canceló', 1); render(); break; } openPed(pa.destino, pa.id); break; }
    case 'peQuitar': PE.items.splice(+d.i, 1); peRender(); break;
    case 'peGuardar': peGuardar(); break;
    case 'pedCancel': confirmDlg('¿Cancelar este pedido sin enviar?', function () { return pedEstado(d.id, 'Cancelado', 'Pedido cancelado'); }, 'Sí, cancelar'); break;
    case 'pedTexto': await pedFresco(); pedTextoDlg(d.id); break;
    case 'ppCopy': copiarTxt(); break;
    case 'pedWa': toast('Cuando lo envíes, toca “Ya lo envié” para marcarlo'); break;
    case 'pedEnviado': pedEstado(d.id, 'Enviado', 'Marcado como enviado ✔'); break;
    case 'pedRecibido': confirmDlg('¿Ya llegó el pedido a ' + pedById(d.id).destino + '?', function () { return pedEstado(d.id, 'Recibido', 'Pedido recibido ✔'); }, 'Sí, ya llegó'); break;
    case 'resPer': S.res.periodo = d.v; S.res.data = null; render(); loadRes(); break;
    case 'resRk': S.res.rk = d.v; render(); break;
    case 'resDet': resDet(d.k, +d.i); break;
    case 'mCancel': closeModal(); break;
    case 'mOk': if (MOK) { await MOK(); } break;
    case 'passSelf':
      var pa = $('#pw_a').value, pn = $('#pw_n').value, pr = $('#pw_r').value;
      if (pn !== pr) { toast('Las contraseñas nuevas no coinciden', 1); break; }
      try { await run(call('passSet', { actual: pa, pass: pn })); ['pw_a', 'pw_n', 'pw_r'].forEach(function (i) { $('#' + i).value = ''; }); toast('Contraseña actualizada ✔'); } catch (e) {}
      break;
    case 'teamPass': passDlg(d.n); break;
    case 'teamEdit': teamEditDlg(d.n); break;
    case 'teamDel':
      confirmDlg('¿Quitar a ' + d.n + ' del equipo?', async function () {
        closeModal();
        try { await run(call('teamDel', { nombre: d.n })); toast('Persona quitada'); await refresh(); } catch (e) {}
      });
      break;
    case 'teamAdd':
      try {
        await run(call('teamAdd', { nombre: $('#t_n').value, rol: $('#t_r').value, turno: $('#t_t').value, area: $('#t_a').value, usuario: $('#t_u').value, pass: $('#t_p').value }));
        toast('Persona agregada ✔'); await refresh();
      } catch (e) {}
      break;
    case 'catNew': itemDlg(d.t, null); break;
    case 'catEdit': itemDlg(d.t, +d.i); break;
    case 'catRen': renDlg(d.t, d.g); break;
    case 'catCopy':
      confirmDlg('¿Copiar los artículos de “' + d.g + '” a ' + otraSuc() + '? Los que ya existan allá no se repiten.', async function () {
        closeModal();
        try { var rc = await run(call('catCopy', { tipo: d.t, g: d.g })); toast(rc.copiados ? rc.copiados + ' artículo(s) copiados a ' + otraSuc() + ' ✔' : 'Ya estaban todos en ' + otraSuc()); } catch (e) {}
      }, 'Sí, copiar');
      break;
    case 'catDel':
      var row = S.cat[d.t][+d.i], t2 = d.t;
      confirmDlg('¿Quitar “' + row[CATS[t2].main] + '” de la lista?', async function () {
        closeModal();
        try { await run(call('catDel', { tipo: t2, vals: row })); toast('Quitado'); await refresh(); if (t2 === 'equipos') progRecarga(); } catch (e) {}
      });
      break;
    case 'colorSave': try { await run(call('brandSet', { color: $('#brandColor').value })); toast('Color guardado ✔'); await refresh(); } catch (e) {} break;
    case 'logoDel':
      confirmDlg('¿Quitar el logo de ' + S.suc + '?', async function () {
        closeModal();
        try { await run(call('brandSet', { logo: '' })); toast('Logo quitado'); await refresh(); } catch (e) {}
      });
      break;
    case 'progV': S.prog.vista = d.v; render(); if (d.v === 'mes') loadMes(); else loadLim(); break;
    case 'progTick': progTick(d.n, d.h === '1'); break;
    case 'progAsig': progAsig(d.n); break;
    case 'progNew': progDlg(null); break;
    case 'progEdit': progDlg(+d.i); break;
    case 'mesGo': S.prog.mes = addMes(S.prog.mes || S.hoy.slice(0, 7), +d.k); S.prog.dia = ''; render(); loadMes(); break;
    case 'mesDia': S.prog.dia = d.f; render(); break;
    case 'mesAsig': mesAsig(d.f, +d.i); break;
    case 'danRep': danRep(+d.i); break;
    case 'dmgOpen': dmgOpen(); break;
  }
});
document.addEventListener('input', function (ev) {
  var el = ev.target, ds = el.dataset || {};
  if (el.closest && el.closest('#progf')) { progPrev(); return; }
  if (el.id === 'pkq') { PK.q = el.value; $('#pkl').innerHTML = pkList(); return; }
  if (el.id === 'ppq') { PP.q = el.value; ppRefresh(); return; }
  if (ds.pq != null) { var k = Object.keys(PP.sel)[+ds.pq]; if (k) PP.sel[k].cant = el.value; return; }
  if (ds.pu != null) { var k2 = Object.keys(PP.sel)[+ds.pu]; if (k2) PP.sel[k2].u = el.value; return; }
  if (ds.eq != null && PE) { PE.items[+ds.eq].cant = el.value; return; }
  if (ds.eu != null && PE) { PE.items[+ds.eu].u = el.value; return; }
  if (ds.b) setPath(ds.b, el.value);
});
document.addEventListener('change', function (ev) {
  var el = ev.target, ds = el.dataset || {};
  if (el.closest && el.closest('#progf')) { progPrev(); return; }
  if (el.id === 'sucSel') {
    var u = S.user; resetState(); S.hoy = u ? S.hoy : ''; initDefaultsLater = true;
    bootApp(el.value).then(function () { if (S.tab === 'lim') { loadLim(); if (S.prog.vista === 'mes') loadMes(); } if (S.tab === 'ped') loadPed(); if (S.tab === 'res') loadRes(); masLoad(); }).catch(function () {});
    return;
  }
  if (el.id === 'ppall') { PP.all = el.checked; ppRefresh(); return; }
  if (el.id === 'logoFile') {
    var f = el.files && el.files[0]; if (!f) return;
    run(logoFromFile(f)).then(function (u2) { return run(call('brandSet', { logo: u2 })); }).then(function () { toast('Logo guardado ✔'); return refresh(); }).catch(function () {});
    return;
  }
  if (ds.pe) { var p = ds.pe.split('|'); planSet({ tipo: 'ENCARGADO', turno: p[0], area: p[1], usuario: el.value }, el.value ? 'Encargado del día guardado ✔' : 'Vuelve el titular'); return; }
  if (ds.b) {
    setPath(ds.b, el.value);
    if (ds.rl === 'tar') loadTar(); else if (ds.rl === 'plan') loadPlan(); else if (ds.rl === 'cie') loadCie();
    else if (ds.b === 'cfg.tipo' || ds.b === 'tar.vista') render();
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && (ev.target.id === 'lu' || ev.target.id === 'lp')) doLogin();
});
var initDefaultsLater = false;
/* ================= temporizadores e inicio ================= */
var timersOn = false;
function startTimers() {
  if (timersOn) return; timersOn = true;
  setInterval(function () {
    var cd = $('#cd');
    if (cd && S.tab === 'tar') {
      var m = minsLeft(); if (m != null) { cd.textContent = cdTxt(m, S.tar.data && S.tar.data.gracia); var b = $('#cdb'); if (b) b.className = 'ab ' + (m <= S.alerta ? (m <= 15 ? 'bad' : 'warn') : 'info'); }
    }
  }, 20000);
  setInterval(function () { if (S.user && !document.hidden) loadAvi(); }, 90000);
  document.addEventListener('visibilitychange', function () {
    if (S.user && !document.hidden) { loadAvi(); if (S.tab === 'tar' && $('#modal').style.display !== 'flex') loadTar(); }
  });
}
(function () {
  var t = load('tk');
  if (t) { S.token = t; S.suc = load('sc') || ''; bootApp().catch(function () { showLogin(); }); }
  else showLogin();
})();
</script>
